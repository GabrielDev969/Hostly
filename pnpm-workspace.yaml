packages:
  - apps/*
  - packages/*
  - '!apps/robot'

# pnpm 12 recusa o install se uma dependência tiver script de build não revisado.
# false = só aviso, telemetria ou binário nativo opcional com fallback em JS.
allowBuilds:
  '@nestjs/core': false
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  cpu-features: false
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  ssh2: false
  unrs-resolver: false
