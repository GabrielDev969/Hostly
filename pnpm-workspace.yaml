packages:
  - apps/*
  - packages/*
  - '!apps/robot'

# Uma versão só pra quem precisa da mesma em todo o workspace.
catalog:
  zod: 4.4.3

# pnpm 12 recusa o install se uma dependência tiver script de build não revisado.
# false = só aviso, telemetria ou binário nativo opcional com fallback em JS.
allowBuilds:
  '@nestjs/core': false
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  cpu-features: false
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  ssh2: false
  unrs-resolver: false

# Peers declarados atrás da versão que o repo usa, provados na #19: o openapi-typescript só imprime
# o AST com o TypeScript 6, e as regras do jsx-a11y rodam no ESLint 10.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'
    eslint-plugin-jsx-a11y>eslint: '10'
