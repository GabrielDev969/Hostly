name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# No PR, um push novo cancela a execução velha; na main toda execução vai até o fim.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions fixadas por SHA (o Dependabot atualiza); os nomes dos jobs são os checks exigidos no ruleset da main.
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # O build regenera os JSON Schema do contracts; diferença ou arquivo novo aqui é schema sem commit.
      - name: JSON Schema em dia
        run: |
          git diff --exit-code -- packages/contracts/schemas
          test -z "$(git status --porcelain -- packages/contracts/schemas)"

      - name: Unit tests
        run: pnpm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Postgres e Redis sobem via Testcontainers no Docker do runner; o test/env.ts gera as chaves.
      - name: E2E tests
        run: pnpm test:e2e

  # Fora dos checks exigidos: um aviso novo na base não trava todo PR, mas deixa este job vermelho.
  # O pnpm audit lê o pnpm-lock.yaml e o auditConfig do pnpm-workspace.yaml, sem install.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: pnpm audit
        run: pnpm audit --audit-level high
