version: 2
updates:
  # Só as actions do CI, que vão fixadas por SHA; os PRs passam pelo mesmo CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Só as atualizações de segurança do npm (#114): o limite 0 desliga os PRs de versão, não os de segurança.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
